span><tspan fill="#E6EDF7">echo $LOOKING_FOR</tspan></text><text class="m l9" x="34" y="317" fill="#8A97AD">Graduate and junior roles in bioinformatics, clinical / life-science data and data analysis · PhD positions</text>
