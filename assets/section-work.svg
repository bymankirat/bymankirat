<style>.n{font:700 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#22D3EE;letter-spacing:2px}.h{font:800 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#E6EDF7;letter-spacing:-.5px}
.ln{stroke-dasharray:900;stroke-dashoffset:900;animation:ln 5s ease-out infinite}@keyframes ln{0%{stroke-dashoffset:900}40%,100%{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important;stroke-dashoffset:0!important}}</style><defs>
<linearGradient id="edgesecwork" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
