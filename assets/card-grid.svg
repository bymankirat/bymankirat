<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" role="img" aria-label="Cork &amp; Dublin 2040 grid plans: Peak demand, substations and budget">
<style>
.k{font:700 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8B5CF6;letter-spacing:2.2px}
.t{font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#E6EDF7}
.s{font:400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8A97AD}
.kpi{font:800 40px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:-1px}
.kl{font:500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8A97AD}
.tag{font:500 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8A97AD}
.go{font:700 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#E6EDF7}
.scan{animation:sc 7s linear infinite}@keyframes sc{0%{transform:translateX(-200px)}60%,100%{transform:translateX(720px)}}
.edge{animation:eg 6s ease-in-out infinite}@keyframes eg{0%,100%{stroke-opacity:.45}50%{stroke-opacity:.95}}
.live{animation:lv 1.6s ease-in-out infinite}@keyframes lv{0%,100%{opacity:1}50%{opacity:.25}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 6s ease-out infinite}@keyframes dr{0%{stroke-dashoffset:1}55%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:.4}}
.pop{opacity:0;animation:pp 6s ease-out infinite}@keyframes pp{0%,20%{opacity:0}40%,90%{opacity:1}100%{opacity:.4}}
.grow{transform-box:fill-box;transform-origin:left center;animation:gw 6s ease-out infinite}@keyframes gw{0%{transform:scaleX(0)}45%,90%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:.4}}
.rise{transform-box:fill-box;transform-origin:center bottom;animation:rs 6s ease-out infinite}@keyframes rs{0%{transform:scaleY(0)}45%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pu 2.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.8);opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 2.6s ease-out infinite}@keyframes rg{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.blink{animation:bk 1.2s steps(1) infinite}@keyframes bk{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important;stroke-dashoffset:0!important}}
</style><defs>
<linearGradient id="edgegrid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="txtgrid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="scangrid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="glowAgrid"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowBgrid"><stop offset="0" stop-color="#22D3EE" stop-opacity=".25"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<filter id="neongrid" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dotsgrid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2A3550"/></pattern>
</defs><clipPath id="clipgrid"><rect width="520" height="260" rx="20"/></clipPath>
<rect width="520" height="260" rx="20" fill="#060A13"/>
<g clip-path="url(#clipgrid)"><rect width="520" height="260" fill="url(#dotsgrid)" opacity=".55"/>
<circle cx="460" cy="40" r="170" fill="url(#glowAgrid)"/>
<circle cx="40" cy="260" r="150" fill="url(#glowBgrid)"/>
<rect class="scan" x="0" y="0" width="140" height="260" fill="url(#scangrid)"/></g>
<rect class="edge" x="1" y="1" width="518" height="258" rx="19" fill="none" stroke="url(#edgegrid)" stroke-width="1.5"/>
<circle class="live" cx="30" cy="34" r="3.5" fill="#8B5CF6"/>
<text class="k" x="42" y="38">ENERGY · PYTHON</text>
<text class="go" x="494" y="38" text-anchor="end">OPEN REPORT ↗</text>
<text class="t" x="26" y="74">Cork &amp; Dublin 2040 grid plans</text>
<text class="s" x="26" y="96">Peak demand, substations and budget</text>
<text class="kpi" x="26" y="160" fill="url(#txtgrid)" filter="url(#neongrid)">122</text>
<text class="kl" x="27" y="182">substations short by 2040</text>
<rect x="26.0" y="212" width="90.3" height="24" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#8A97AD" stroke-opacity=".35"/><text x="71.2" y="228" class="tag" text-anchor="middle">Monte Carlo</text><rect x="123.3" y="212" width="65.5" height="24" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#8A97AD" stroke-opacity=".35"/><text x="156.0" y="228" class="tag" text-anchor="middle">Leaflet</text><rect x="195.8" y="212" width="71.7" height="24" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#8A97AD" stroke-opacity=".35"/><text x="231.6" y="228" class="tag" text-anchor="middle">planning</text>
