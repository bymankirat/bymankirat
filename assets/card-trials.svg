<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" role="img" aria-label="Why clinical trials stop early: 40,124 trials · interactive trial explorer">
<style>
.k{font:700 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#22D3EE;letter-spacing:2.2px}
.t{font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#E6EDF7}
.s{font:400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8A97AD}
.kpi{font:800 40px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:-1px}
.kl{font:500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8A97AD}
.tag{font:500 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8A97AD}
.go{font:700 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#E6EDF7}
.scan{animation:sc 7s linear infinite}@keyframes sc{0%{transform:translateX(-200px)}60%,100%{transform:translateX(720px)}}
.edge{animation:eg 6s ease-in-out infinite}@keyframes eg{0%,100%{stroke-opacity:.45}50%{stroke-opacity:.95}}
.live{animation:lv 1.6s ease-in-out infinite}@keyframes lv{0%,100%{opacity:1}50%{opacity:.25}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 6s ease-out infinite}@keyframes dr{0%{stroke-dashoffset:1}55%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:.4}}
.pop{opacity:0;animation:pp 6s ease-out infinite}@keyframes pp{0%,20%{opacity:0}40%,90%{opacity:1}100%{opacity:.4}}
.grow{transform-box:fill-box;transform-origin:left center;animation:gw 6s ease-out infinite}@keyframes gw{0%{transform:scaleX(0)}45%,90%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:.4}}
.rise{transform-box:fill-box;transform-origin:center bottom;animation:rs 6s ease-out infinite}@keyframes rs{0%{transform:scaleY(0)}45%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pu 2.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.8);opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 2.6s ease-out infinite}@keyframes rg{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.blink{animation:bk 1.2s steps(1) infinite}@keyframes bk{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important;stroke-dashoffset:0!important}}
</style><defs>
<linearGradient id="edgetrials" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="txttrials" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="scantrials" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="glowAtrials"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowBtrials"><stop offset="0" stop-color="#22D3EE" stop-opacity=".25"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<filter id="neontrials" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dotstrials" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2A3550"/></pattern>
</defs><clipPath id="cliptrials"><rect width="520" height="260" rx="20"/></clipPath>
<rect width="520" height="260" rx="20" fill="#060A13"/>
<g clip-path="url(#cliptrials)"><rect width="520" height="260" fill="url(#dotstrials)" opacity=".55"/>
<circle cx="460" cy="40" r="170" fill="url(#glowAtrials)"/>
<circle cx="40" cy="260" r="150" fill="url(#glowBtrials)"/>
<rect class="scan" x="0" y="0" width="140" height="260" fill="url(#scantrials)"/></g>
<rect class="edge" x="1" y="1" width="518" height="258" rx="19" fill="none" stroke="url(#edgetrials)" stroke-width="1.5"/>
<circle class="live" cx="30" cy="34" r="3.5" fill="#22D3EE"/>
<text class="k" x="42" y="38">CLINICAL TRIALS · PYTHON</text>
<text class="go" x="494" y="38" text-anchor="end">OPEN REPORT ↗</text>
<text class="t" x="26" y="74">Why clinical trials stop early</text>
<text class="s" x="26" y="96">40,124 trials · interactive trial explorer</text>
<text class="kpi" x="26" y="160" fill="url(#txttrials)" filter="url(#neontrials)">1 in 6</text>
<text class="kl" x="27" y="182">stopped early</text>
<rect x="26.0" y="212" width="96.5" height="24" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#8A97AD" stroke-opacity=".35"/><text x="74.3" y="228" class="tag" text-anchor="middle">scikit-learn</text><rect x="129.5" y="212" width="40.6" height="24" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#8A97AD" stroke-opacity=".35"/><text x="149.8" y="228" class="tag" text-anchor="middle">API</text><rect x="177.2" y="212" width="84.1" height="24" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#8A97AD" stroke-opacity=".35"/><text x="219.2" y="228" class="tag" text-anchor="middle">risk model</text>
<g><line class="grow" style="animation-delay:0.00s" x1="299.1" x2="488.6" y1="116.0" y2="116.0" stroke="#22D3EE" stroke-opacity="0.95" stroke-width="4.5" stroke-linecap="round"/><circle class="pop" style="animation-delay:0.60s" cx="488.6" cy="116.0" r="3" fill="#A3E635"/><line class="grow" style="animation-delay:0.12s" x1="303.1" x2="488.0" y1="126.5" y2="126.5" stroke="#22D3EE" stroke-opacity="0.95" stroke-width="4.5" stroke-linecap="round"/><circle class="pop" style="animation-delay:0.72s" cx="488.0" cy="126.5" r="3" fill="#A3E635"/><line class="grow" style="animation-delay:0.24s" x1="310.8" x2="369.9" y1="137.0" y2="137.0" stroke="#8A97AD" stroke-opacity="0.45" stroke-width="4.5" stroke-linecap="round"/><path class="pop" style="animation-delay:0.84s" d="M364.9,132.0 L374.9,142.0 M374.9,132.0 L364.9,142.0" stroke="#F472B6" stroke-width="2.4" stroke-linecap="round" filter="url(#neontrials)"/><line class="grow" style="animation-delay:0.36s" x1="292.4" x2="485.6" y1="147.5" y2="147.5" stroke="#22D3EE" stroke-opacity="0.95" stroke-width="4.5" stroke-linecap="round"/><circle class="pop" style="animation-delay:0.96s" cx="485.6" cy="147.5" r="3" fill="#A3E635"/><line class="grow" style="animation-delay:0.48s" x1="299.8" x2="491.7" y1="158.0" y2="158.0" stroke="#22D3EE" stroke-opacity="0.95" stroke-width="4.5" stroke-linecap="round"/><circle class="pop" style="animation-delay:1.08s" cx="491.7" cy="158.0" r="3" fill="#A3E635"/><line class="grow" style="animation-delay:0.60s" x1="321.9" x2="401.8" y1="168.5" y2="168.5" stroke="#8A97AD" stroke-opacity="0.45" stroke-width="4.5" stroke-linecap="round"/><path class="pop" style="animation-delay:1.20s" d="M396.8,163.5 L406.8,173.5 M406.8,163.5 L396.8,173.5" stroke="#F472B6" stroke-width="2.4" stroke-linecap="round" filter="url(#neontrials)"/><line class="grow" style="animation-delay:0.72s" x1="317.1" x2="489.2" y1="179.0" y2="179.0" stroke="#22D3EE" stroke-opacity="0.95" stroke-width="4.5" stroke-linecap="round"/><circle class="pop" style="animation-delay:1.32s" cx="489.2" cy="179.0" r="3" fill="#A3E635"/><line class="grow" style="animation-delay:0.84s" x1="311.2" x2="375.7" y1="189.5" y2="189.5" stroke="#8A97AD" stroke-opacity="0.45" stroke-width="4.5" stroke-linecap="round"/><path class="pop" style="animation-delay:1.44s" d="M370.7,184.5 L380.7,194.5 M380.7,184.5 L370.7,194.5" stroke="#F472B6" stroke-width="2.4" stroke-linecap="round" filter="url(#neontrials)"/><line class="grow" style="animation-delay:0.96s" x1="311.0" x2="485.3" y1="200.0" y2="200.0" stroke="#22D3EE" stroke-opacity="0.95" stroke-width="4.5" stroke-linecap="round"/><circle class="pop" style="animation-delay:1.56s" cx="485.3" cy="200.0" r="3" fill="#A3E635"/></g>
</svg>