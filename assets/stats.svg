<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="16 projects, 8 live interactive reports, 40,124 clinical trials analysed, 100GB+ sequencing data processed">
<style>
.v{font:800 40px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:-1px}.l{font:500 12.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8A97AD}
.in{}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important;stroke-dashoffset:0!important}}
</style><defs>
<linearGradient id="edgestats" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="txtstats" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="scanstats" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="glowAstats"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowBstats"><stop offset="0" stop-color="#22D3EE" stop-opacity=".25"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<filter id="neonstats" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dotsstats" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2A3550"/></pattern>
</defs>
<rect width="1200" height="150" rx="18" fill="#060A13"/>
<g class="in" style="animation-delay:0.00s"><rect x="20.0" y="18" width="278.0" height="114" rx="16" fill="#ffffff" fill-opacity=".025" stroke="url(#edgestats)" stroke-opacity=".5"/><text x="44.0" y="80" class="v" fill="url(#txtstats)" filter="url(#neonstats)">16</text><text x="45.0" y="106" class="l">research and data projects</text></g><g class="in" style="animation-delay:0.25s"><rect x="314.0" y="18" width="278.0" height="114" rx="16" fill="#ffffff" fill-opacity=".025" stroke="url(#edgestats)" stroke-opacity=".5"/><text x="338.0" y="80" class="v" fill="url(#txtstats)" filter="url(#neonstats)">9</text><text x="339.0" y="106" class="l">live interactive reports</text></g><g class="in" style="animation-delay:0.50s"><rect x="608.0" y="18" width="278.0" height="114" rx="16" fill="#ffffff" fill-opacity=".025" stroke="url(#edgestats)" stroke-opacity=".5"/><text x="632.0" y="80" class="v" fill="url(#txtstats)" filter="url(#neonstats)">40,124</text><text x="633.0" y="106" class="l">clinical trials analysed</text></g><g class="in" style="animation-delay:0.75s"><rect x="902.0" y="18" width="278.0" height="114" rx="16" fill="#ffffff" fill-opacity=".025" stroke="url(#edgestats)" stroke-opacity=".5"/><text x="926.0" y="80" class="v" fill="url(#txtstats)" filter="url(#neonstats)">100GB+</text><text x="927.0" y="106" class="l">sequencing data processed</text></g>
</svg>