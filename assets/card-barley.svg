<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" role="img" aria-label="Barley, Weather and Beer: 40 years of weather vs Irish harvests · map">
<style>
.k{font:700 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#FBBF24;letter-spacing:2.2px}
